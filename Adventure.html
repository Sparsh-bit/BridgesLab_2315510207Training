<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Example</title>
    <link rel="stylesheet" href="Adventure.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <section class="hero d-flex align-items-center justify-content-center text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-3" style="text-align: center;">Register Yourself</h3>
                        <form action="">
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Enter Your Name Here" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Enter Your Age</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter Your E-mail Here" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone" placeholder="Enter Your Phone Number Here" required>
                            </div>

                            <div class="mb-3">
                                <label for="country" class="form-label">Select Your Camp-Type</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>Choose.......</option>
                                    <option value="Luxury Safari">Luxury Safari</option>
                                    <option value="Tented Camps">Tented Camps</option>
                                    <option value="Bush Camps">Bush Camps</option>
                                    <option value="Mobile Camps">Mobile Camps</option>
                                    <option value="Forest Rest Houses/Inspection">Forest Rest Houses/Inspection</option>
                                </select>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="terms.html" class="text-decoration-none">Terms & Conditions</a>
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" onclick="">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </section>
</body>

</html>
