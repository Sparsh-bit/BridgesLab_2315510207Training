<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 - Welcome Page Greeting</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #greeting { cursor: pointer; }
    #welcomeMessage { margin-top: 10px; }
    button { margin-right: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1 id="greeting">Welcome!</h1>
  </header>

  <main>
    <section>
      <p id="welcomeMessage">We are glad to have you here.</p>
      <button id="changeGreetingBtn">Change Greeting</button>
      <button id="toggleWelcomeBtn">Toggle Welcome Message</button>
    </section>
  </main>

  <script src="Q1_greeting.js"></script>
</body>
</html>
