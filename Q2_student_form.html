<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q2 - Student Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .error {
      color: red;
      font-size: 0.9rem;
    }
    .success {
      color: green;
      font-size: 1rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Q2: Student Registration Form</h1>

  <form id="studentForm" novalidate>
    <div class="form-group">
      <label for="name">Name (alphabets only)</label>
      <input type="text" id="name" />
      <span class="error" id="nameError"></span>
    </div>

    <div class="form-group">
      <label for="email">Email (example@domain.com)</label>
      <input type="email" id="email" />
      <span class="error" id="emailError"></span>
    </div>

    <div class="form-group">
      <label for="phone">Phone (10 digits)</label>
      <input type="text" id="phone" />
      <span class="error" id="phoneError"></span>
    </div>

    <div class="form-group">
      <label for="password">Password (1 uppercase, 1 number, 1 special character)</label>
      <input type="password" id="password" />
      <span class="error" id="passwordError"></span>
    </div>

    <button type="submit">Register</button>
  </form>

  <div id="formSuccess" class="success"></div>

  <script src="Q2_student_form.js"></script>
</body>
</html>
