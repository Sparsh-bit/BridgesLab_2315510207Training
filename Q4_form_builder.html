<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q4 - Custom Form Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Q4: Dynamic Form Builder</h1>
  <div id="formContainer"></div>
  <button id="submitBtn">Submit</button>

  <h2>Form Data</h2>
  <pre id="formDataOutput">{}</pre>

  <script src="Q4_form_builder.js"></script>
</body>
</html>
