<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q7 - Login Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .error {
      color: red;
      font-size: 0.9rem;
    }
    .success {
      color: green;
      font-size: 1rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Q7: Login Form Validation</h1>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="username">Username (at least 5 characters)</label>
      <input type="text" id="username" />
      <span class="error" id="usernameError"></span>
    </div>

    <div class="form-group">
      <label for="password">Password (min 8 chars, number, upper, lower, special)</label>
      <input type="password" id="password" />
      <span class="error" id="passwordError"></span>
    </div>

    <button type="submit">Login</button>
  </form>

  <div id="loginMessage" class="success"></div>

  <script src="Q7_login_validation.js"></script>
</body>
</html>
