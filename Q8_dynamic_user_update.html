<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q8 - Dynamic Object Updater</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Q8: Dynamic Object Updater</h1>

  <form id="userForm">
    <div class="form-group">
      <label for="userName">Name</label>
      <input type="text" id="userName" />
    </div>

    <div class="form-group">
      <label for="userEmail">Email</label>
      <input type="email" id="userEmail" />
    </div>

    <div class="form-group">
      <label for="userAge">Age</label>
      <input type="number" id="userAge" />
    </div>

    <button type="submit">Update User</button>
  </form>

  <h2>Updated User Object</h2>
  <pre id="userOutput"></pre>

  <script src="Q8_dynamic_user_update.js"></script>
</body>
</html>
