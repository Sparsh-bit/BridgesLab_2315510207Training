<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q9 - Multi-jQuery Widgets</title>
  <!-- jQuery Version 1 (for carousel & highlighting) -->
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script>
    var jqV1 = jQuery.noConflict(true); // keep reference to v1
  </script>

  <!-- jQuery Version 3 (for modal & tooltips) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    var jqV2 = jQuery.noConflict(true); // keep reference to v3
  </script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #carousel { display: flex; overflow: hidden; border: 1px solid #ccc; width: 300px; }
    .slide { min-width: 300px; padding: 10px; text-align: center; }
    .active-widget { border: 2px solid #4caf50; }
    #modalOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
    }
    #modal {
      background: #fff; padding: 20px; border-radius: 4px; min-width: 200px;
    }
    .tooltip {
      position: absolute; background: #333; color: #fff;
      padding: 4px 6px; font-size: 0.8rem; border-radius: 3px; display: none;
    }
    .widget { margin: 10px 0; padding: 6px; border: 1px solid #ccc; display: inline-block; }
  </style>
</head>
<body>
  <main>
    <h1>Q9: Multi-jQuery Widgets</h1>

    <section id="carouselSection" class="widget">
      <h2>Carousel (jQuery v1)</h2>
      <div id="carousel">
        <div class="slide">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide">Slide 3</div>
        <div class="slide">Slide 4</div>
        <div class="slide">Slide 5</div>
      </div>
    </section>

    <section id="modalSection" class="widget" data-tooltip="Click to open modal">
      <h2>Notifications Modal (jQuery v2)</h2>
      <button id="openModalBtn">Open Modal</button>
    </section>

    <div id="modalOverlay">
      <div id="modal">
        <p>This is a notification modal.</p>
        <button id="closeModalBtn">Close</button>
      </div>
    </div>

    <div id="tooltip" class="tooltip"></div>
  </main>

  <script src="Q9_multi_jquery_widgets.js"></script>
</body>
</html>
